    <style>
      /* Header */
      .notif-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--color-border);
        animation: fadeInDown 0.4s ease-out;
      }

      .notif-header h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--color-text-primary);
      }

      .notif-header h1 span {
        background: var(--color-primary-light);
        font-size: 0.75rem;
        padding: 2px 14px;
        border-radius: 40px;
        font-weight: 500;
        color: var(--color-primary);
      }

      .notif-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .notif-actions button {
        padding: 8px 18px;
        border-radius: 40px;
        border: 1px solid var(--color-border);
        background: var(--color-bg-card);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition-base);
        font-family: inherit;
        color: var(--color-text-primary);
      }

      .notif-actions button:hover {
        background: var(--color-bg-secondary);
        border-color: var(--color-border-hover);
      }

      .notif-actions .mark-all-btn {
        background: var(--color-primary);
        color: var(--color-text-inverse);
        border: none;
      }

      .notif-actions .mark-all-btn:hover {
        background: var(--color-primary-dark);
      }

      /* Filter tabs */
      .filter-tabs {
        display: flex;
        gap: 4px;
        background: var(--color-bg-secondary);
        border-radius: 60px;
        padding: 4px;
        margin-bottom: 24px;
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .filter-tab {
        padding: 8px 20px;
        border: none;
        background: transparent;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--color-text-tertiary);
        cursor: pointer;
        transition: var(--transition-base);
        white-space: nowrap;
        font-family: inherit;
      }

      .filter-tab.active {
        background: var(--color-bg-card);
        color: var(--color-text-primary);
        box-shadow: var(--shadow-sm);
      }

      .filter-tab:hover:not(.active) {
        color: var(--color-text-primary);
      }

      /* Notification list */
      .notif-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .notif-item {
        display: flex;
        gap: 16px;
        padding: 16px 20px;
        border-radius: 16px;
        background: var(--color-bg-card);
        border: 1px solid var(--color-border);
        transition: var(--transition-base);
        cursor: pointer;
        align-items: flex-start;
        position: relative;
        animation: fadeInUp 0.3s ease-out backwards;
      }

      .notif-item:nth-child(1) { animation-delay: 0.05s; }
      .notif-item:nth-child(2) { animation-delay: 0.1s; }
      .notif-item:nth-child(3) { animation-delay: 0.15s; }

      .notif-item:hover {
        border-color: var(--color-border-hover);
        background: var(--color-bg-secondary);
      }

      .notif-item.unread {
        background: var(--color-primary-light);
        border-color: var(--color-primary);
      }

      .notif-item.unread::before {
        content: '';
        position: absolute;
        left: -1px;
        top: 20%;
        bottom: 20%;
        width: 4px;
        background: var(--color-primary);
        border-radius: 0 4px 4px 0;
      }

      .notif-icon {
        font-size: 1.5rem;
        min-width: 40px;
        text-align: center;
        padding-top: 2px;
      }

      .notif-content {
        flex: 1;
      }

      .notif-content .title {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 2px;
        color: var(--color-text-primary);
      }

      .notif-content .message {
        color: var(--color-text-secondary);
        font-size: 0.9rem;
      }

      .notif-content .time {
        color: var(--color-text-tertiary);
        font-size: 0.8rem;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .notif-content .time .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--color-primary);
        display: inline-block;
      }

      .notif-item.read .notif-content .time .dot {
        background: var(--color-border);
      }

      .notif-actions-item {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        align-items: center;
      }

      .notif-actions-item button {
        background: none;
        border: none;
        color: var(--color-text-tertiary);
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 0.8rem;
        transition: var(--transition-base);
        font-family: inherit;
      }

      .notif-actions-item button:hover {
        background: var(--color-bg-secondary);
        color: var(--color-text-primary);
      }

      .notif-actions-item .delete-btn:hover {
        background: var(--color-error-light);
        color: var(--color-error);
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--color-text-tertiary);
      }

      .empty-state .big-icon {
        font-size: 3.5rem;
        margin-bottom: 12px;
      }

      .empty-state h3 {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--color-text-primary);
        margin-bottom: 4px;
      }

      .empty-state p {
        color: var(--color-text-tertiary);
      }

      /* Toast message */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--color-primary);
        color: var(--color-text-inverse);
        padding: 14px 24px;
        border-radius: 16px;
        font-weight: 500;
        font-size: 0.95rem;
        box-shadow: var(--shadow-lg);
        animation: slideUp 0.3s ease;
        z-index: 1000;
        max-width: 400px;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive */
      @media (max-width: 640px) {
        .notif-header {
          flex-direction: column;
          align-items: stretch;
        }
        .notif-actions {
          justify-content: stretch;
        }
        .notif-actions button {
          flex: 1;
          text-align: center;
        }
        .filter-tabs {
          border-radius: 16px;
        }
        .filter-tab {
          padding: 6px 14px;
          font-size: 0.75rem;
        }
        .notif-item {
          flex-wrap: wrap;
          padding: 14px 16px;
        }
        .notif-actions-item {
          width: 100%;
          justify-content: flex-end;
          margin-top: 4px;
        }
        .toast {
          left: 16px;
          right: 16px;
          bottom: 16px;
        }
      }
    </style>

    <script>
      // ===== Notifications State =====
      let notifications = [];
      let currentFilter = 'all';
      let currentNotifications = [];
      let isLoading = false;

      // ===== Auth Check =====
      async function checkAuth() {
        const user = await window.getCurrentUser();
        if (!user) {
          // Show login prompt for unauthenticated users
          document.getElementById('notifList').innerHTML = `
            <div class="empty-state">
              <div class="big-icon">🔐</div>
              <h3>Sign in to view notifications</h3>
              <p>Get personalized job alerts and application updates.</p>
              <a href="auth.html" class="submit-btn" style="display:inline-block;margin-top:16px;text-decoration:none;">Sign In</a>
            </div>
          `;
          document.getElementById('notifCount').textContent = '0';
          return false;
        }
        return true;
      }

      // ===== Load Notifications from Supabase =====
      async function loadNotifications() {
        const isAuthed = await checkAuth();
        if (!isAuthed) return;

        isLoading = true;
        document.getElementById('notifList').innerHTML = `
          <div class="empty-state">
            <div class="big-icon" style="animation: spin 1s linear infinite;">⏳</div>
            <h3>Loading notifications...</h3>
          </div>
        `;

        try {
          notifications = await window.getNotifications();

          // If no notifications, add welcome notification
          if (notifications.length === 0) {
            await window.createNotification({
              type: 'system',
              title: 'Welcome to Rise!',
              message: 'Thanks for joining. We\'ll notify you about new job matches and application updates.',
              icon: '👋'
            });
            notifications = await window.getNotifications();
          }

          renderNotifications(currentFilter);
        } catch (error) {
          console.error('Load notifications error:', error);
          document.getElementById('notifList').innerHTML = `
            <div class="empty-state">
              <div class="big-icon">⚠️</div>
              <h3>Failed to load notifications</h3>
              <p>Please try again later.</p>
            </div>
          `;
        } finally {
          isLoading = false;
        }
      }

      // ===== Format Time Ago =====
      function formatTimeAgo(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        const diff = now - date;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        if (minutes < 1) return 'Just now';
        if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
        if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
        if (days < 7) return `${days} day${days > 1 ? 's' : ''} ago`;
        return date.toLocaleDateString();
      }

      // ===== Render Notifications =====
      function renderNotifications(filter = 'all') {
        const container = document.getElementById('notifList');
        let filtered = [...notifications];

        // Apply filter
        if (filter === 'unread') {
          filtered = filtered.filter((n) => !n.read);
        } else if (filter === 'read') {
          filtered = filtered.filter((n) => n.read);
        } else if (filter !== 'all') {
          filtered = filtered.filter((n) => n.type === filter);
        }

        // Sort by created_at (newest first)
        filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

        currentNotifications = filtered;

        // Update count
        const unreadCount = notifications.filter((n) => !n.read).length;
        document.getElementById('notifCount').textContent = unreadCount;

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="big-icon">🔕</div>
              <h3>No notifications</h3>
              <p>${filter === 'all' ? "You're all caught up!" : 'No notifications match this filter.'}</p>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered
          .map((notif) => `
            <div class="notif-item ${notif.read ? 'read' : 'unread'}"
                 data-id="${notif.id}"
                 onclick="markAsRead('${notif.id}')">
                <div class="notif-icon">${notif.icon || '🔔'}</div>
                <div class="notif-content">
                    <div class="title">${notif.title}</div>
                    <div class="message">${notif.message || ''}</div>
                    <div class="time">
                        <span>${formatTimeAgo(notif.created_at)}</span>
                        ${!notif.read ? '<span class="dot"></span>' : ''}
                        <span style="background:var(--color-bg-secondary);padding:0 12px;border-radius:40px;font-size:0.7rem;text-transform:capitalize;">${notif.type}</span>
                    </div>
                </div>
                <div class="notif-actions-item">
                    ${!notif.read ? `<button onclick="event.stopPropagation(); markAsRead('${notif.id}')" title="Mark as read">✓</button>` : ''}
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteNotification('${notif.id}')" title="Delete">✕</button>
                </div>
            </div>
          `)
          .join('');
      }

      // ===== Actions =====
      async function markAsRead(id) {
        const notif = notifications.find((n) => n.id === id);
        if (notif) {
          notif.read = true;
          renderNotifications(currentFilter);
          showToast('✓ Marked as read');

          // Update in Supabase
          await window.markNotificationRead(id);
        }
      }

      async function markAllAsRead() {
        notifications.forEach((n) => (n.read = true));
        renderNotifications(currentFilter);
        showToast('✓ All notifications marked as read');

        // Update all in Supabase
        await window.markAllNotificationsRead();
      }

      async function deleteNotification(id) {
        if (confirm('Delete this notification?')) {
          notifications = notifications.filter((n) => n.id !== id);
          renderNotifications(currentFilter);
          showToast('🗑️ Notification deleted');

          // Delete from Supabase
          await window.deleteNotification(id);
        }
      }

      async function clearAll() {
        if (confirm('Delete all notifications?')) {
          notifications = [];
          renderNotifications(currentFilter);
          showToast('🗑️ All notifications cleared');

          // Clear all in Supabase
          await window.clearAllNotifications();
        }
      }

      function filterNotifications(filter) {
        currentFilter = filter;

        // Update active tab
        document.querySelectorAll('.filter-tab').forEach((tab) => {
          tab.classList.remove('active');
          if (tab.dataset.filter === filter) {
            tab.classList.add('active');
          }
        });

        renderNotifications(filter);
      }

      // ===== Toast Message =====
      function showToast(message) {
        // Remove existing toast
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s';
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      }

      // ===== Keyboard shortcuts =====
      document.addEventListener('keydown', function (e) {
        // Ctrl/Cmd + Shift + M = Mark all as read
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'M') {
          e.preventDefault();
          markAllAsRead();
        }
      });

      // ===== Initialize =====
      loadNotifications();

      // Auto-refresh every 30 seconds
      let refreshInterval = setInterval(() => {
        loadNotifications();
      }, 30000);

      // Stop interval when page is hidden to save resources
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          clearInterval(refreshInterval);
        } else {
          refreshInterval = setInterval(() => {
            loadNotifications();
          }, 30000);
        }
      });

      // Handle URL params
      (function checkFilterFromURL() {
        const params = new URLSearchParams(window.location.search);
        const filter = params.get('filter');
        if (filter && ['all', 'unread', 'read', 'job', 'application', 'system'].includes(filter)) {
          filterNotifications(filter);
        }
      })();

      console.log('🔔 Notifications page loaded with Supabase integration.');
    </script>
  </body>
</html>
