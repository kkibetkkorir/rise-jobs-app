    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f7fafd;
        color: #0b1a2f;
        padding: 24px 16px 48px;
        line-height: 1.6;
      }

      .notifications-container {
        max-width: 820px;
        margin: 0 auto;
        background: white;
        border-radius: 32px;
        padding: 32px 36px 40px;
        box-shadow: 0 10px 30px -8px rgba(0, 20, 40, 0.06);
        border: 1px solid #e6edf5;
      }

      /* Header */
      .notif-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #edf2f8;
      }

      .notif-header h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .notif-header h1 span {
        background: #f0f6fe;
        font-size: 0.75rem;
        padding: 2px 14px;
        border-radius: 40px;
        font-weight: 500;
        color: #1d3d60;
      }

      .notif-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .notif-actions button {
        padding: 8px 18px;
        border-radius: 40px;
        border: 1px solid #dce5ef;
        background: white;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
        color: #0b1a2f;
      }

      .notif-actions button:hover {
        background: #f0f5fc;
        border-color: #b0c8e0;
      }

      .notif-actions .mark-all-btn {
        background: #0b1a2f;
        color: white;
        border: none;
      }

      .notif-actions .mark-all-btn:hover {
        background: #1d3452;
      }

      /* Filter tabs */
      .filter-tabs {
        display: flex;
        gap: 4px;
        background: #f0f5fc;
        border-radius: 60px;
        padding: 4px;
        margin-bottom: 24px;
        overflow-x: auto;
        flex-wrap: nowrap;
      }

      .filter-tab {
        padding: 8px 20px;
        border: none;
        background: transparent;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.85rem;
        color: #4f6f8f;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
        font-family: inherit;
      }

      .filter-tab.active {
        background: white;
        color: #0b1a2f;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }

      .filter-tab:hover:not(.active) {
        color: #0b1a2f;
      }

      /* Notification list */
      .notif-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .notif-item {
        display: flex;
        gap: 16px;
        padding: 16px 20px;
        border-radius: 16px;
        background: #fafcfe;
        border: 1px solid #eef4fa;
        transition: all 0.15s;
        cursor: pointer;
        align-items: flex-start;
        position: relative;
      }

      .notif-item:hover {
        border-color: #d0dff0;
        background: #f8fbfe;
      }

      .notif-item.unread {
        background: #f0f6fe;
        border-color: #c4d6ed;
      }

      .notif-item.unread::before {
        content: '';
        position: absolute;
        left: -1px;
        top: 20%;
        bottom: 20%;
        width: 4px;
        background: #0b1a2f;
        border-radius: 0 4px 4px 0;
      }

      .notif-icon {
        font-size: 1.5rem;
        min-width: 40px;
        text-align: center;
        padding-top: 2px;
      }

      .notif-content {
        flex: 1;
      }

      .notif-content .title {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 2px;
      }

      .notif-content .message {
        color: #2a4a68;
        font-size: 0.9rem;
      }

      .notif-content .time {
        color: #6b8aa8;
        font-size: 0.8rem;
        margin-top: 4px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .notif-content .time .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #0b1a2f;
        display: inline-block;
      }

      .notif-item.read .notif-content .time .dot {
        background: #d0d9e6;
      }

      .notif-actions-item {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
        align-items: center;
      }

      .notif-actions-item button {
        background: none;
        border: none;
        color: #6b8aa8;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 0.8rem;
        transition: 0.15s;
        font-family: inherit;
      }

      .notif-actions-item button:hover {
        background: #f0f5fc;
        color: #0b1a2f;
      }

      .notif-actions-item .delete-btn:hover {
        background: #ffebee;
        color: #c62828;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #4f6f8f;
      }

      .empty-state .big-icon {
        font-size: 3.5rem;
        margin-bottom: 12px;
      }

      .empty-state h3 {
        font-size: 1.2rem;
        font-weight: 600;
        color: #0b1a2f;
        margin-bottom: 4px;
      }

      .empty-state p {
        color: #6b8aa8;
      }

      /* Toast message */
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: #0b1a2f;
        color: white;
        padding: 14px 24px;
        border-radius: 16px;
        font-weight: 500;
        font-size: 0.95rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        animation: slideUp 0.3s ease;
        z-index: 1000;
        max-width: 400px;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive */
      @media (max-width: 640px) {
        .notifications-container {
          padding: 20px 16px;
        }
        .notif-header {
          flex-direction: column;
          align-items: stretch;
        }
        .notif-actions {
          justify-content: stretch;
        }
        .notif-actions button {
          flex: 1;
          text-align: center;
        }
        .filter-tabs {
          border-radius: 16px;
        }
        .filter-tab {
          padding: 6px 14px;
          font-size: 0.75rem;
        }
        .notif-item {
          flex-wrap: wrap;
          padding: 14px 16px;
        }
        .notif-actions-item {
          width: 100%;
          justify-content: flex-end;
          margin-top: 4px;
        }
        .toast {
          left: 16px;
          right: 16px;
          bottom: 16px;
        }
      }
    </style>

    <script>
      // ===== Sample Notification Data =====
      let notifications = [
        {
          id: 1,
          type: 'job',
          icon: '💼',
          title: 'New job match: Senior Software Engineer',
          message: 'A new job at Google matches your profile. Check it out!',
          time: '2 minutes ago',
          read: false,
          timestamp: Date.now() - 120000,
        },
        {
          id: 2,
          type: 'application',
          icon: '📝',
          title: 'Application viewed',
          message:
            'Your application for Product Manager at Microsoft was viewed.',
          time: '1 hour ago',
          read: false,
          timestamp: Date.now() - 3600000,
        },
        {
          id: 3,
          type: 'system',
          icon: '⚙️',
          title: 'Profile updated successfully',
          message: 'Your profile information has been updated.',
          time: '3 hours ago',
          read: true,
          timestamp: Date.now() - 10800000,
        },
        {
          id: 4,
          type: 'job',
          icon: '🔥',
          title: 'Trending job: Staff Engineer at Twilio',
          message: 'This job is getting a lot of attention. Apply now!',
          time: '5 hours ago',
          read: true,
          timestamp: Date.now() - 18000000,
        },
        {
          id: 5,
          type: 'application',
          icon: '✅',
          title: 'Application submitted',
          message:
            'Your application for UX Designer at Apple was submitted successfully.',
          time: '1 day ago',
          read: true,
          timestamp: Date.now() - 86400000,
        },
        {
          id: 6,
          type: 'system',
          icon: '🔐',
          title: 'Security alert',
          message: 'New login detected from Chrome on Windows. Was this you?',
          time: '2 days ago',
          read: false,
          timestamp: Date.now() - 172800000,
        },
        {
          id: 7,
          type: 'job',
          icon: '⭐',
          title: 'Saved job closing soon',
          message:
            'Your saved job "Engineering Manager" at TrustedHousesitters closes in 3 days.',
          time: '3 days ago',
          read: true,
          timestamp: Date.now() - 259200000,
        },
        {
          id: 8,
          type: 'application',
          icon: '📊',
          title: 'Application status update',
          message:
            'Your application for Data Scientist at Netflix has been moved to the next round.',
          time: '4 days ago',
          read: true,
          timestamp: Date.now() - 345600000,
        },
      ];

      let currentFilter = 'all';
      let currentNotifications = [...notifications];

      // ===== Render Notifications =====
      function renderNotifications(filter = 'all') {
        const container = document.getElementById('notifList');
        let filtered = [...notifications];

        // Apply filter
        if (filter === 'unread') {
          filtered = filtered.filter((n) => !n.read);
        } else if (filter === 'read') {
          filtered = filtered.filter((n) => n.read);
        } else if (filter !== 'all') {
          filtered = filtered.filter((n) => n.type === filter);
        }

        // Sort by timestamp (newest first)
        filtered.sort((a, b) => b.timestamp - a.timestamp);

        currentNotifications = filtered;

        // Update count
        const unreadCount = notifications.filter((n) => !n.read).length;
        document.getElementById('notifCount').textContent = unreadCount;

        if (filtered.length === 0) {
          container.innerHTML = `
                <div class="empty-state">
                    <div class="big-icon">🔕</div>
                    <h3>No notifications</h3>
                    <p>${
                      filter === 'all'
                        ? "You're all caught up!"
                        : 'No notifications match this filter.'
                    }</p>
                </div>
            `;
          return;
        }

        container.innerHTML = filtered
          .map(
            (notif) => `
            <div class="notif-item ${notif.read ? 'read' : 'unread'}" 
                 data-id="${notif.id}"
                 onclick="markAsRead(${notif.id})">
                <div class="notif-icon">${notif.icon}</div>
                <div class="notif-content">
                    <div class="title">${notif.title}</div>
                    <div class="message">${notif.message}</div>
                    <div class="time">
                        <span>${notif.time}</span>
                        ${!notif.read ? '<span class="dot"></span>' : ''}
                        <span style="background:#eaf0f8;padding:0 12px;border-radius:40px;font-size:0.7rem;text-transform:capitalize;">${
                          notif.type
                        }</span>
                    </div>
                </div>
                <div class="notif-actions-item">
                    ${
                      !notif.read
                        ? `<button onclick="event.stopPropagation(); markAsRead(${notif.id})" title="Mark as read">✓</button>`
                        : ''
                    }
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteNotification(${
                      notif.id
                    })" title="Delete">✕</button>
                </div>
            </div>
        `
          )
          .join('');
      }

      // ===== Actions =====
      function markAsRead(id) {
        const notif = notifications.find((n) => n.id === id);
        if (notif) {
          notif.read = true;
          renderNotifications(currentFilter);
          showToast('✓ Marked as read');
        }
      }

      function markAllAsRead() {
        notifications.forEach((n) => (n.read = true));
        renderNotifications(currentFilter);
        showToast('✓ All notifications marked as read');
      }

      function deleteNotification(id) {
        if (confirm('Delete this notification?')) {
          notifications = notifications.filter((n) => n.id !== id);
          renderNotifications(currentFilter);
          showToast('🗑️ Notification deleted');
        }
      }

      function clearAll() {
        if (confirm('Delete all notifications?')) {
          notifications = [];
          renderNotifications(currentFilter);
          showToast('🗑️ All notifications cleared');
        }
      }

      function filterNotifications(filter) {
        currentFilter = filter;

        // Update active tab
        document.querySelectorAll('.filter-tab').forEach((tab) => {
          tab.classList.remove('active');
          if (tab.dataset.filter === filter) {
            tab.classList.add('active');
          }
        });

        renderNotifications(filter);
      }

      // ===== Toast Message =====
      function showToast(message) {
        // Remove existing toast
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s';
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      }

      // ===== Simulate New Notifications =====
      function simulateNewNotification() {
        const types = ['job', 'application', 'system'];
        const icons = {
          job: ['💼', '🔥', '⭐', '🎯'],
          application: ['📝', '✅', '📊', '📨'],
          system: ['⚙️', '🔐', '🔄', '📌'],
        };
        const titles = {
          job: [
            'New job match',
            'Trending position',
            'Recommended for you',
            'Job alert',
          ],
          application: [
            'Application update',
            'Application viewed',
            'Interview invitation',
            'Application submitted',
          ],
          system: [
            'Profile update',
            'Security alert',
            'System notification',
            'Account reminder',
          ],
        };
        const messages = {
          job: [
            'A new position matches your skills and preferences.',
            'This job is trending in your area of expertise.',
            'Based on your profile, this job is a great fit.',
            "Don't miss this opportunity!",
          ],
          application: [
            'Your application status has been updated.',
            'The hiring manager reviewed your application.',
            "You've been selected for the next round.",
            'Your application was received successfully.',
          ],
          system: [
            'Your account settings were updated.',
            'New login detected from an unfamiliar device.',
            'A system update is available.',
            'Your profile needs your attention.',
          ],
        };

        const type = types[Math.floor(Math.random() * types.length)];
        const iconList = icons[type];
        const titleList = titles[type];
        const messageList = messages[type];

        const newNotif = {
          id: Date.now(),
          type: type,
          icon: iconList[Math.floor(Math.random() * iconList.length)],
          title: titleList[Math.floor(Math.random() * titleList.length)],
          message: messageList[Math.floor(Math.random() * messageList.length)],
          time: 'Just now',
          read: false,
          timestamp: Date.now(),
        };

        notifications.unshift(newNotif);
        renderNotifications(currentFilter);
        showToast('🔔 New notification received!');
      }

      // ===== Keyboard shortcuts =====
      document.addEventListener('keydown', function (e) {
        // Ctrl/Cmd + Shift + N = New notification (demo)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'N') {
          e.preventDefault();
          simulateNewNotification();
        }
        // Ctrl/Cmd + Shift + M = Mark all as read
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'M') {
          e.preventDefault();
          markAllAsRead();
        }
      });

      // ===== Initialize =====
      renderNotifications('all');

      // Auto-refresh every 30 seconds to simulate real-time updates
      let refreshInterval = setInterval(() => {
        // In a real app, you'd fetch from API
        // For demo, we'll just update the timestamps
        // and occasionally add a new notification (20% chance)
        if (Math.random() < 0.3) {
          simulateNewNotification();
        }
      }, 30000);

      // Stop interval when page is hidden to save resources
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          clearInterval(refreshInterval);
        } else {
          refreshInterval = setInterval(() => {
            if (Math.random() < 0.3) {
              simulateNewNotification();
            }
          }, 30000);
        }
      });

      console.log(
        '🔔 Notifications page loaded. Features: Filter, Read/Unread, Delete, Clear All'
      );
      console.log(
        '💡 Keyboard shortcuts: Ctrl+Shift+N = New notification, Ctrl+Shift+M = Mark all as read'
      );
      console.log(
        '📌 Try: notifications.html?filter=unread to open with filter applied'
      );

      // Handle URL params
      (function checkFilterFromURL() {
        const params = new URLSearchParams(window.location.search);
        const filter = params.get('filter');
        if (
          filter &&
          ['all', 'unread', 'read', 'job', 'application', 'system'].includes(
            filter
          )
        ) {
          filterNotifications(filter);
        }
      })();
    </script>
  </body>
</html>
