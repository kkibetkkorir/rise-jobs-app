<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Offline - Rise Jobs</title>

      name="title"

    <!-- ===== SERVICE WORKER ===== -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registered successfully');
            })
            .catch((err) => {
              console.log('ServiceWorker registration failed:', err);
            });
        });
      }
    </script>

    <!-- ===== STRUCTURED DATA (JSON-LD) ===== -->
    <script type="application/ld+json">

        "description": "Find your next career opportunity with Rise - the modern job board connecting talent with opportunity.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://rise.app/?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #f7fafd;
        color: #0b1a2f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .container {
        background: white;
        border-radius: 32px;
        padding: 48px 36px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      p {
        color: #4f6f8f;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-block;
        background: #0b1a2f;
        color: white;
        padding: 12px 32px;
        border-radius: 40px;
        text-decoration: none;
        font-weight: 600;
      }
      .btn:hover {
        background: #1d3452;
      }
    </style>
