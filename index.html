    <style>
        /* header / branding */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            animation: fadeInDown 0.5s ease-out;
        }

        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(145deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            font-weight: 400;
            font-size: 0.9rem;
            background: var(--color-gray-100);
            padding: 4px 12px;
            border-radius: 40px;
            -webkit-text-fill-color: var(--color-text-secondary);
            color: var(--color-text-secondary);
            margin-left: 8px;
            transition: all var(--transition-base);
        }

        body.dark-mode .logo span {
            background: var(--color-gray-700);
        }

        /* Logo SVG theming */
        .logo-svg {
            fill: var(--color-primary);
            transition: fill var(--transition-base);
        }

        body.dark-mode .logo-svg {
            fill: var(--color-gray-100);
        }

        .logo SVG path {
            fill: inherit;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--color-bg-card);
            border-radius: 60px;
            padding: 4px 4px 4px 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
            transition: all var(--transition-base);
            flex: 1 1 300px;
            max-width: 480px;
            max-height: 40px;
        }

        .search-box:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--color-primary);
        }

        .search-box input {
            border: none;
            padding: 12px 0;
            font-size: 0.95rem;
            width: 100%;
            background: transparent;
            outline: none;
            font-weight: 450;
            color: var(--color-text-primary);
        }

        .search-box input::placeholder {
            color: var(--color-text-light);
            font-weight: 400;
        }

        .search-box button {
            background: var(--color-primary);
            border: none;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 10px 22px;
            border-radius: 40px;
            cursor: pointer;
            transition: all var(--transition-base);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .search-box button:hover {
            background: var(--color-primary-hover);
            transform: scale(1.02);
        }

        .search-box button:active {
            transform: scale(0.98);
        }

        /* filter chips */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            margin-bottom: 28px;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            animation: fadeInUp 0.5s ease-out 0.1s both;
        }

        .filters > * {
            flex-shrink: 0;
        }

        .filters::-webkit-scrollbar {
            height: 3px;
        }

        .filters::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 10px;
        }

        .filter-chip {
            background: var(--color-bg-card);
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            box-shadow: var(--shadow-xs);
            border: 1px solid var(--color-border);
            cursor: pointer;
            transition: all var(--transition-base);
            animation: fadeInUp 0.4s ease-out both;
        }

        .filter-chip:nth-child(1) { animation-delay: 0.05s; }
        .filter-chip:nth-child(2) { animation-delay: 0.08s; }
        .filter-chip:nth-child(3) { animation-delay: 0.11s; }
        .filter-chip:nth-child(4) { animation-delay: 0.14s; }
        .filter-chip:nth-child(5) { animation-delay: 0.17s; }
        .filter-chip:nth-child(6) { animation-delay: 0.20s; }

        .filter-chip:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary);
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
            box-shadow: var(--shadow-md);
        }

        /* date filter */
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            background: var(--color-bg-card);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid var(--color-border);
            animation: fadeInUp 0.5s ease-out 0.15s both;
        }

        body.dark-mode .filter-controls {
            background: var(--color-bg-secondary);
        }

        .filter-controls label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-controls input[type="date"] {
            padding: 8px 14px;
            border: 1px solid var(--color-border);
            border-radius: 40px;
            font-size: 0.85rem;
            background: var(--color-bg-secondary);
            font-family: inherit;
            outline: none;
            color: var(--color-text-primary);
            transition: all var(--transition-base);
        }

        .filter-controls input[type="date"]:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(11, 26, 47, 0.1);
        }

        .filter-controls .clear-date {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid var(--color-border);
            background: var(--color-bg-card);
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition-base);
            color: var(--color-text-secondary);
        }

        .filter-controls .clear-date:hover {
            background: var(--color-bg-hover);
            border-color: var(--color-primary);
        }

        /* job grid */
        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .job-card {
            background: var(--color-bg-card);
            border-radius: 20px;
            padding: 22px 20px 20px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--color-border-light);
            transition: all var(--transition-base);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            animation: fadeInUp 0.5s ease-out both;
        }

        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-card-hover);
            border-color: var(--color-border);
        }

        body.dark-mode .job-card:hover {
            border-color: var(--color-gray-600);
        }

        .company-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .company-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--color-gray-100);
            flex-shrink: 0;
            border: 1px solid var(--color-border-light);
            transition: all var(--transition-base);
        }

        .job-card:hover .company-avatar {
            transform: scale(1.05);
        }

        .company-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--color-text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .company-meta {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
        }

        .company-meta span {
            background: var(--color-bg-hover);
            padding: 2px 10px;
            border-radius: 30px;
            transition: all var(--transition-base);
        }

        body.dark-mode .company-meta span {
            background: var(--color-gray-700);
        }

        .job-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin: 6px 0 10px;
            line-height: 1.3;
            color: var(--color-text-primary);
        }

        .job-location {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .job-location svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--color-border-light);
        }

        body.dark-mode .job-footer {
            border-top-color: var(--color-gray-700);
        }

        .job-type {
            background: var(--color-bg-hover);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-primary);
            letter-spacing: 0.2px;
            transition: all var(--transition-base);
        }

        body.dark-mode .job-type {
            background: var(--color-gray-700);
            color: var(--color-gray-300);
        }

        .job-link {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--color-text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all var(--transition-fast);
        }

        .job-link:hover {
            color: var(--color-primary-hover);
            gap: 8px;
        }

        /* pagination */
        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px 16px;
            margin-top: 20px;
            animation: fadeInUp 0.5s ease-out;
        }

        .pagination button {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--color-text-primary);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .pagination button:hover:not(:disabled) {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
            transform: translateY(-1px);
        }

        .pagination button:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .page-info {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            font-weight: 450;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-secondary);
            background: var(--color-bg-card);
            border-radius: 40px;
            border: 1px solid var(--color-border);
            animation: fadeIn 0.5s ease-out;
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header .logo h1 {
                display: none;
            }

            .search-box {
                max-width: 100%;
            }
            .job-grid {
                grid-template-columns: 1fr;
            }
            .filters {
                gap: 6px;
            }
            .filter-chip {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            .filter-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-controls input[type="date"] {
                width: 100%;
            }
        }

    </style>

</head>

(function() {
"use strict";

// ---- state ----
let currentPage = 1;
const limit = 10;          // jobs per page (clean)
let totalJobs = 0;
let currentJobs = [];
let activeFilter = 'all';
let searchQuery = '';

// DOM refs
const grid = document.getElementById('jobGrid');
const prevBtn = document.getElementById('prevPage');
const nextBtn = document.getElementById('nextPage');
const pageInfo = document.getElementById('pageInfo');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const filterChips = document.querySelectorAll('.filter-chip');

// ---- helpers ----
function buildUrl(page, filter = activeFilter, query = searchQuery) {
  // base: public jobs with pagination & trending
  let url = `https://api.joinrise.io/api/v1/jobs/public?page=${page}&limit=${limit}&sort=desc&sortedBy=createdAt&includeDescription=true&isTrending=false&country`;
  // if search query present -> we'll use the /searches/top-keywords? but we need to filter client-side or use search param.
  // but endpoints don't have search query param; we'll fetch all and filter client-side (simpler, consistent)
  // However we also need to support 'filter' by category — we'll fetch from /openjobs endpoints with department/featuredCategory
  // For simplicity and to use real endpoints we do a hybrid:
  // - if filter is 'all' and no search: fetch from /jobs/public (already)
  // - for specific filters we call the /openjobs endpoints with department/category.
  // Because the provided endpoints have many variations:
  // for 'Hybrid' we use /openjobs?jobType=Hybrid
  // for 'Remote' we use /openjobs?featuredCategory=Remote
  // for 'Startup' we use /openjobs?companySize=startup
  // for 'Legal' /openjobs?department=Legal,Compliance
  // for 'Growth' /openjobs?department=Growth,Strategy...
  // for 'Operations' /openjobs?department=Growth,Strategy,Consulting,Operations...
  // else fallback to public

  if (filter === 'all' && !query) {
    return url;
  }

  // Build openjobs request with parameters
  let openUrl = 'https://api.joinrise.io/api/v1/jobs/openjobs?';
  const params = new URLSearchParams();
  params.set('page', page);
  params.set('limit', limit);
  params.set('isOpenJobs', 'true');
  params.set('sortedBy', 'createdAt');
  params.set('sort', 'desc');
  params.set('unique', 'true');

  // mapping filter -> openjobs parameter
  if (filter === 'Hybrid') {
    params.set('jobType', 'Hybrid');
  } else if (filter === 'Remote') {
    params.set('featuredCategory', 'Remote');
  } else if (filter === 'Startup') {
    params.set('companySize', 'startup');
  } else if (filter === 'Legal') {
    params.set('department', 'Legal,Compliance');
  } else if (filter === 'Growth') {
    params.set('department', 'Growth,Strategy,Consulting,Operations,Program+and+Project+Management,Purchasing');
  } else if (filter === 'Operations') {
    params.set('department', 'Growth,Strategy,Consulting,Operations,Program+and+Project+Management,Purchasing');
  } else {
    // fallback to public
    return url;
  }

  // if query present, we filter client-side anyway — but we'll still use openjobs.
  // we append query as a client-side filter after fetch.
  return openUrl + params.toString();
}

// client-side filtering by search query (title, company, location)
function filterJobsBySearch(jobs, query) {
  if (!query.trim()) return jobs;
  const q = query.trim().toLowerCase();
  return jobs.filter(job => {
    const title = (job.title || '').toLowerCase();
    const company = (job.owner?.companyName || job.companyName || '').toLowerCase();
    const loc = (job.locationAddress || job.location?.address || '').toLowerCase();
    return title.includes(q) || company.includes(q) || loc.includes(q);
  });
}

// ---- fetch & render ----
async function fetchJobs(page, filter, query) {
  try {
    const url = buildUrl(page, filter, query);
    const response = await fetch(url);
    if (!response.ok) throw new Error('API error');
    const data = await response.json();

    let jobs = [];
    let total = 0;

    // parse different response structures
    if (data.result && data.result.jobs) {
      jobs = data.result.jobs;
      total = data.result.count || jobs.length;
    } else if (data.result && Array.isArray(data.result)) {
      jobs = data.result;
      total = data.result.length;
    } else if (data.result && data.result.jobs) {
      // already handled
    } else if (Array.isArray(data)) {
      jobs = data;
      total = data.length;
    } else {
      // fallback for public endpoint
      if (data.result && data.result.jobs) jobs = data.result.jobs;
      else if (data.jobs) jobs = data.jobs;
      else jobs = [];
      total = data.result?.count || jobs.length;
    }

    // if we have a search query, filter client-side
    if (query.trim()) {
      jobs = filterJobsBySearch(jobs, query);
      total = jobs.length;
    }

    // ensure we have consistent job shape
    const normalized = jobs.map(job => {
      // if job has nested 'job' array (from openjobs) flatten
      if (job.job && Array.isArray(job.job) && job.job.length > 0) {
        const inner = job.job[0];
        return { ...job, ...inner, owner: job.owner || inner.owner };
      }
      return job;
    });

    return { jobs: normalized, total };
  } catch (err) {
    console.warn('Fetch error:', err);
    return { jobs: [], total: 0 };
  }
}

function renderJobs(jobs, page, total) {
  grid.innerHTML = '';
  if (!jobs || jobs.length === 0) {
    grid.innerHTML = `<div class="empty-state"><p style="font-size:1.2rem; font-weight:500;">✨ No jobs found</p><p style="color:#6b85a0; margin-top:8px;">Try adjusting filters or search</p></div>`;
    return;
  }

  jobs.slice(0, limit).forEach(job => {
    const card = document.createElement('div');
    card.className = 'job-card';

    const companyName = job.owner?.companyName || job.companyName || 'Company';
    const logo = job.owner?.photo || job.photo || 'https://ui-avatars.com/api/?name='+encodeURIComponent(companyName)+'&background=eef2f6&color=1f3a57&size=44';
    const title = job.title || 'Position';
    const location = job.locationAddress || job.location?.address || 'Remote';
    const type = job.type || job.jobType || 'Hybrid';
    const url = job.url || job.redirectUrl || '#';

    card.innerHTML = `
      <div class="company-row">
        <img class="company-avatar" src="${logo}" alt="${companyName}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(companyName)}&background=eef2f6&color=1f3a57&size=44'">
        <div>
          <div class="company-name">${companyName}</div>
          <div class="company-meta"><span>${job.owner?.sector || job.sector || ''}</span></div>
        </div>
      </div>
      <div class="job-title">${title}</div>
      <div class="job-location">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        ${location}
      </div>
      <div class="job-footer">
        <span class="job-type">${type}</span>
        <a href="single-job.html?id=${job._id}" class="job-link">Apply →</a>
      </div>
    `;
    grid.appendChild(card);
  });

  // update pagination
  const totalPages = Math.ceil(total / limit);
  pageInfo.textContent = `Page ${page} of ${totalPages || 1}`;
  prevBtn.disabled = page <= 1;
  nextBtn.disabled = page >= totalPages;
}

async function loadPage(page) {
  const { jobs, total } = await fetchJobs(page, activeFilter, searchQuery);
  currentJobs = jobs;
  totalJobs = total;
  renderJobs(jobs, page, total);
  currentPage = page;
}

// ---- event listeners ----
function handleSearch() {
  searchQuery = searchInput.value.trim();
  loadPage(1);
}

searchBtn.addEventListener('click', handleSearch);
searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });

filterChips.forEach(chip => {
  chip.addEventListener('click', function() {
    filterChips.forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.filter || 'all';
    // reset search input when filter changes? keep but we refetch
    loadPage(1);
  });
});

prevBtn.addEventListener('click', () => {
  if (currentPage > 1) loadPage(currentPage - 1);
});
nextBtn.addEventListener('click', () => {
  const totalPages = Math.ceil(totalJobs / limit);
  if (currentPage < totalPages) loadPage(currentPage + 1);
});

// ---- init ----
loadPage(1);
})();
