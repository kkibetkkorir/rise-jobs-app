<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rise · Jobs by Skill</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        .wrapper {
            padding: 20px 24px 24px;
            transition: background var(--transition-base);
            height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .skill-header {
            background: var(--color-bg-card);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            animation: fadeInDown 0.4s ease-out;
        }
        .skill-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--color-text-primary);
        }
        .skill-header .job-count {
            font-size: 14px;
            color: var(--color-text-tertiary);
            background: var(--color-bg-secondary);
            padding: 4px 16px;
            border-radius: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--color-text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 16px;
            transition: color var(--transition-base);
        }
        .back-link:hover {
            color: var(--color-primary);
        }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .job-card {
            background: var(--color-bg-card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-border);
            transition: transform var(--transition-base), box-shadow var(--transition-base), background var(--transition-base), border-color var(--transition-base);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeInUp 0.4s ease-out backwards;
        }
        .job-card:nth-child(1) { animation-delay: 0.05s; }
        .job-card:nth-child(2) { animation-delay: 0.1s; }
        .job-card:nth-child(3) { animation-delay: 0.15s; }
        .job-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--color-border-hover);
        }

        .job-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .job-card .company-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .job-card .company-initial {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }

        .job-card .company-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--color-text-primary);
        }

        .job-card .job-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--color-text-primary);
            line-height: 1.3;
        }

        .job-card .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 13px;
            color: var(--color-text-tertiary);
        }
        .job-card .job-meta span {
            background: var(--color-bg-secondary);
            padding: 2px 12px;
            border-radius: 20px;
        }

        .job-card .job-budget {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .job-card .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            padding-top: 12px;
            border-top: 1px solid var(--color-border);
        }

        .job-card .job-footer .apply-link {
            padding: 6px 20px;
            background: var(--color-primary);
            color: var(--color-text-inverse);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition-base);
            font-family: inherit;
            text-decoration: none;
        }
        .job-card .job-footer .apply-link:hover {
            background: var(--color-primary-dark);
        }

        .job-card .job-footer .job-type {
            font-size: 12px;
            color: var(--color-text-tertiary);
            background: var(--color-bg-secondary);
            padding: 4px 14px;
            border-radius: 20px;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-tertiary);
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-tertiary);
            grid-column: 1 / -1;
        }
        .empty-state h3 {
            color: var(--color-text-primary);
            font-size: 20px;
            margin-bottom: 8px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }
        .pagination button {
            padding: 8px 20px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: var(--color-bg-card);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition-base);
            color: var(--color-text-primary);
        }
        .pagination button:hover:not(:disabled) {
            background: var(--color-primary);
            color: var(--color-text-inverse);
            border-color: var(--color-primary);
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination .page-info {
            font-size: 14px;
            color: var(--color-text-tertiary);
        }

        @media (max-width: 768px) {
            .skill-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .job-grid {
                grid-template-columns: 1fr;
            }
            .wrapper {
                padding: 12px 16px;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css" /> 
    <link rel="stylesheet" href="nav.css" />
    <link rel="stylesheet" href="bottom-nav.css" />
</head>
<body>

    <div class="app">
        <header id="mainHeader">
            <a href="jobs.html" class="logo">
                <svg viewBox="0 0 512 512">
                    <path d="M512 503.5H381.7a48 48 0 01-45.3-32.1L265 268.1l-9-25.5 2.7-124.6L338.2 8.5l23.5 67.1L512 503.5z"/>
                    <path d="M361.7 75.6L265 268.1l-9-25.5 2.7-124.6L338.2 8.5z"/>
                    <path d="M338.2 8.5l-82.2 234-80.4 228.9a48 48 0 01-45.3 32.1H0l173.8-495h164.4z"/>
                </svg>
                Rise <span>Jobs</span>
            </a>
            <nav class="header-menu">
                <a href="jobs.html">Jobs</a>
                <a href="skills.html" class="active">Skills</a>
                <a href="roles.html">Roles</a>
            </nav>
            <div class="user-settings">
                <div class="dark-light" id="darkModeToggle" title="Toggle dark mode">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </div>
                <span class="user-name" style="font-size:14px;font-weight:600;">John Doe</span>
            </div>
        </header>

        <div class="wrapper" id="mainWrapper">
            <a href="skills.html" class="back-link">← Back to Skills</a>

            <div class="skill-header" id="skillHeader">
                <h2 id="skillName">Loading...</h2>
                <span class="job-count" id="jobCount">0 jobs found</span>
            </div>

            <div class="job-grid" id="jobGrid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading jobs...</p>
                </div>
            </div>

            <div class="pagination" id="pagination">
                <button id="prevPage" disabled onclick="changePage('prev')">← Previous</button>
                <span class="page-info" id="pageInfo">Page 1</span>
                <button id="nextPage" onclick="changePage('next')">Next →</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="jobs.html" class="nav-item">
                <span class="icon">💼</span>
                <span class="label">Jobs</span>
            </a>
            <a href="skills.html" class="nav-item active">
                <span class="icon">🔍</span>
                <span class="label">Search</span>
            </a>
            <a href="jobs.html" class="nav-item center-btn">
                <span class="icon">➕</span>
                <span class="label">Jobs</span>
            </a>
            <a href="account.html?tab=saved" class="nav-item" data-tab="saved">
                <span class="icon">⭐</span>
                <span class="label">Saved</span>
                <span class="badge">3</span>
            </a>
            <a href="account.html" class="nav-item" data-tab="profile">
                <span class="icon">👤</span>
                <span class="label">Profile</span>
            </a>
        </nav>
    </div>

    <script src="theme.js"></script>
    <script>
        const API_BASE = 'https://app.usebraintrust.com/api';
        let currentPage = 1;
        let totalJobs = 0;
        let currentJobs = [];
        let skillId = '';
        let skillName = '';

        const jobGrid = document.getElementById('jobGrid');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const pageInfo = document.getElementById('pageInfo');
        const skillNameEl = document.getElementById('skillName');
        const jobCountEl = document.getElementById('jobCount');

        function getParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                skill: params.get('skill'),
                name: params.get('name')
            };
        }

        async function fetchJobsBySkill(skill, page = 1) {
            if (!skill) {
                jobGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>⚠️ No skill specified</h3>
                        <p>Please select a skill from the skills page.</p>
                    </div>
                `;
                return;
            }

            showLoading(true);
            try {
                const url = `${API_BASE}/jobs/?page=${page}&skills=${skill}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.results) {
                    currentJobs = data.results;
                    totalJobs = data.count || currentJobs.length;
                    renderJobs(currentJobs);
                    updatePagination(page, totalJobs);
                } else {
                    showEmpty('No jobs found for this skill.');
                }
            } catch (error) {
                console.error('Error fetching jobs:', error);
                showEmpty('Failed to load jobs. Please try again.');
            } finally {
                showLoading(false);
            }
        }

        function renderJobs(jobs) {
            if (!jobs || jobs.length === 0) {
                showEmpty('No jobs found for this skill.');
                return;
            }

            jobGrid.innerHTML = '';
            jobs.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';

                const color = getColor(job.employer?.name || '');
                const initial = (job.employer?.name || 'C').charAt(0).toUpperCase();
                const budget = job.budget_minimum_usd && job.budget_maximum_usd ?
                    `$${parseFloat(job.budget_minimum_usd).toFixed(0)} - $${parseFloat(job.budget_maximum_usd).toFixed(0)}` :
                    'Rate negotiable';
                const paymentType = job.payment_type || 'hourly';
                const jobType = job.job_type || 'freelance';
                const roleName = job.role?.name || '';

                card.innerHTML = `
                    <div class="top">
                        <div class="company-badge">
                            <div class="company-initial" style="background:${color};">${initial}</div>
                            <div>
                                <div class="company-name">${job.employer?.name || 'Company'}</div>
                                <div style="font-size:12px;color:var(--color-text-tertiary);">${roleName}</div>
                            </div>
                        </div>
                        <span style="font-size:12px;color:var(--color-text-tertiary);background:var(--color-bg-secondary);padding:2px 12px;border-radius:20px;">${jobType}</span>
                    </div>
                    <div class="job-title">${job.title || 'Position'}</div>
                    <div class="job-meta">
                        <span>💼 ${paymentType}</span>
                        <span>📅 ${job.contract_type || 'N/A'}</span>
                        ${job.expected_hours_per_week ? `<span>🕐 ${job.expected_hours_per_week}h/wk</span>` : ''}
                    </div>
                    <div class="job-budget">${budget}</div>
                    <div class="job-footer">
                        <span class="job-type">${job.openings_left || 0} openings</span>
                        <a href="application.html?job_id=${job.id}" class="apply-link">Apply Now →</a>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.apply-link')) {
                        window.location.href = `application.html?job_id=${job.id}`;
                    }
                });

                jobGrid.appendChild(card);
            });
        }

        function getColor(str) {
            const colors = ['#0b1a2f', '#f76754', '#55acee', '#2e2882', '#fe5b5f', '#5c6bc0', '#ea4c88', '#fbbb00', '#28b446',
                '#f14336'
            ];
            let hash = 0;
            for (let i = 0; i < (str || '').length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function showLoading(show) {
            if (show) {
                jobGrid.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading jobs...</p>
                    </div>
                `;
            }
        }

        function showEmpty(msg) {
            jobGrid.innerHTML = `
                <div class="empty-state">
                    <h3>🔍 ${msg}</h3>
                    <p>Try exploring other skills.</p>
                </div>
            `;
        }

        function updatePagination(page, total) {
            const totalPages = Math.ceil(total / 20) || 1;
            pageInfo.textContent = `Page ${page} of ${totalPages}`;
            prevBtn.disabled = page <= 1;
            nextBtn.disabled = page >= totalPages;
            currentPage = page;
        }

        function changePage(direction) {
            if (direction === 'prev' && currentPage > 1) {
                fetchJobsBySkill(skillId, currentPage - 1);
            } else if (direction === 'next') {
                fetchJobsBySkill(skillId, currentPage + 1);
            }
        }

        const wrapper = document.getElementById('mainWrapper');
        const header = document.getElementById('mainHeader');
        wrapper.addEventListener('scroll', function() {
            header.classList.toggle('header-shadow', this.scrollTop > 30);
        });

        // ============================================================
        // INIT
        // ============================================================
        const params = getParams();
        skillId = params.skill;
        skillName = params.name || 'Skill';

        if (skillName) {
            skillNameEl.textContent = `⚡ ${skillName}`;
        } else {
            skillNameEl.textContent = '⚡ Skill';
        }

        fetchJobsBySkill(skillId, 1);

        console.log('⚡ Braintrust Skill Jobs loaded successfully!');
        console.log('📌 Skill:', skillName, '(ID:', skillId, ')');
    </script>

</body>
</html>
