<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rise · Job Roles</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        .wrapper {
            padding: 20px 24px 24px;
            transition: background var(--transition-base);
            height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .roles-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
            animation: fadeInDown 0.4s ease-out;
        }
        .roles-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-text-primary);
        }
        .roles-header input {
            padding: 10px 16px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
            outline: none;
            font-family: inherit;
            min-width: 200px;
            transition: border-color var(--transition-base), box-shadow var(--transition-base);
        }
        .roles-header input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        .roles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .role-card {
            background: var(--color-bg-card);
            padding: 18px 22px;
            border-radius: 14px;
            border: 1px solid var(--color-border);
            transition: transform var(--transition-base), box-shadow var(--transition-base), background var(--transition-base), border-color var(--transition-base);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeInUp 0.4s ease-out backwards;
        }
        .role-card:nth-child(1) { animation-delay: 0.05s; }
        .role-card:nth-child(2) { animation-delay: 0.1s; }
        .role-card:nth-child(3) { animation-delay: 0.15s; }
        .role-card:nth-child(4) { animation-delay: 0.2s; }
        .role-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--color-border-hover);
        }

        .role-card .role-name {
            font-weight: 600;
            font-size: 16px;
            color: var(--color-text-primary);
        }

        .role-card .role-plural {
            font-size: 13px;
            color: var(--color-text-tertiary);
        }

        .role-card .role-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 14px;
            border-radius: 20px;
            margin-top: 6px;
            align-self: flex-start;
        }
        .role-card .role-badge.green {
            background: rgba(22, 101, 52, 0.15);
            color: #166534;
        }
        body.dark-mode .role-card .role-badge.green {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }
        .role-card .role-badge.violet {
            background: rgba(91, 33, 182, 0.15);
            color: #5b21b6;
        }
        body.dark-mode .role-card .role-badge.violet {
            background: rgba(139, 92, 246, 0.2);
            color: #8b5cf6;
        }
        .role-card .role-badge.blue {
            background: rgba(30, 64, 175, 0.15);
            color: #1e40af;
        }
        body.dark-mode .role-card .role-badge.blue {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }
        .role-card .role-badge.teal {
            background: rgba(13, 107, 99, 0.15);
            color: #0d6b63;
        }
        body.dark-mode .role-card .role-badge.teal {
            background: rgba(20, 184, 166, 0.2);
            color: #14b8a6;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-tertiary);
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-tertiary);
            grid-column: 1 / -1;
        }
        .empty-state h3 {
            color: var(--color-text-primary);
            font-size: 20px;
            margin-bottom: 8px;
        }


        @media (max-width: 768px) {
            .header-menu a {
                padding: 6px 14px;
                font-size: 13px;
            }
            .roles-header {
                flex-direction: column;
                align-items: stretch;
            }
            .roles-header input {
                width: 100%;
            }
            .roles-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .wrapper {
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .roles-grid {
                grid-template-columns: 1fr 1fr;
            }
            .role-card {
                padding: 14px 16px;
            }
            .role-card .role-name {
                font-size: 14px;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css" /> 
    <link rel="stylesheet" href="nav.css" />
    <link rel="stylesheet" href="bottom-nav.css" />
</head>
<body>

    <div class="app">
        <!-- ===== HEADER ===== -->
        <header id="mainHeader">
            <a href="jobs.html" class="logo">
                <svg viewBox="0 0 512 512">
                    <path d="M512 503.5H381.7a48 48 0 01-45.3-32.1L265 268.1l-9-25.5 2.7-124.6L338.2 8.5l23.5 67.1L512 503.5z"/>
                    <path d="M361.7 75.6L265 268.1l-9-25.5 2.7-124.6L338.2 8.5z"/>
                    <path d="M338.2 8.5l-82.2 234-80.4 228.9a48 48 0 01-45.3 32.1H0l173.8-495h164.4z"/>
                </svg>
                Rise <span>Roles</span>
            </a>
            <nav class="header-menu">
                <a href="jobs.html">Jobs</a>
                <a href="skills.html">Skills</a>
                <a href="roles.html" class="active">Roles</a>
            </nav>
            <div class="user-settings">
                <div class="dark-light" id="darkModeToggle" title="Toggle dark mode">
                    <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </div>
                <span class="user-name" style="font-size:14px;font-weight:600;">John Doe</span>
            </div>
        </header>

        <!-- ===== WRAPPER ===== -->
        <div class="wrapper" id="mainWrapper">

            <div class="roles-header">
                <h2>🎯 Job Roles</h2>
                <input type="text" id="roleSearch" placeholder="Search roles..." oninput="filterRoles()" />
            </div>

            <div class="roles-grid" id="rolesGrid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading roles...</p>
                </div>
            </div>
        </div>

        <!-- ===== BOTTOM NAV ===== -->
        <nav class="bottom-nav">
            <a href="jobs.html" class="nav-item">
                <span class="icon">💼</span>
                <span class="label">Jobs</span>
            </a>
            <a href="search.html" class="nav-item">
                <span class="icon">🔍</span>
                <span class="label">Search</span>
            </a>
            <a href="jobs.html" class="nav-item center-btn">
                <span class="icon">➕</span>
                <span class="label">Jobs</span>
            </a>
            <a href="account.html?tab=saved" class="nav-item" data-tab="saved">
                <span class="icon">⭐</span>
                <span class="label">Saved</span>
                <span class="badge">3</span>
            </a>
            <a href="account.html" class="nav-item" data-tab="profile">
                <span class="icon">👤</span>
                <span class="label">Profile</span>
            </a>
        </nav>
    </div>

    <script src="theme.js"></script>
    <script>
        // ============================================================
        // BRAINTRUST ROLES API
        // ============================================================
        const API_BASE = 'https://app.usebraintrust.com/api';
        let allRoles = [];
        let filteredRoles = [];

        const rolesGrid = document.getElementById('rolesGrid');
        const roleSearch = document.getElementById('roleSearch');

        // ============================================================
        // FETCH ROLES
        // ============================================================
        async function fetchRoles() {
            try {
                const response = await fetch(`${API_BASE}/roles/`);
                const data = await response.json();
                allRoles = data;
                filteredRoles = allRoles;
                renderRoles();
            } catch (error) {
                console.error('Error fetching roles:', error);
                rolesGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>⚠️ Failed to load roles</h3>
                        <p>Please try again later.</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // RENDER ROLES
        // ============================================================
        function renderRoles() {
            if (filteredRoles.length === 0) {
                rolesGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>🔍 No roles found</h3>
                        <p>Try adjusting your search.</p>
                    </div>
                `;
                return;
            }

            rolesGrid.innerHTML = '';
            filteredRoles.forEach(role => {
                const card = document.createElement('div');
                card.className = 'role-card';

                const colorClass = role.color || 'teal';
                const badgeText = role.is_featured ? '⭐ Featured' : '';

                card.innerHTML = `
                    <div class="role-name">${role.name}</div>
                    <div class="role-plural">${role.name_plural || ''}</div>
                    ${badgeText ? `<span class="role-badge ${colorClass}">${badgeText}</span>` : ''}
                `;

                card.addEventListener('click', () => {
                    window.location.href = `jobs.html?role=${role.id}`;
                });

                rolesGrid.appendChild(card);
            });
        }

        // ============================================================
        // FILTER ROLES
        // ============================================================
        function filterRoles() {
            const query = roleSearch.value.toLowerCase().trim();
            if (!query) {
                filteredRoles = allRoles;
            } else {
                filteredRoles = allRoles.filter(r =>
                    r.name.toLowerCase().includes(query) ||
                    (r.name_plural && r.name_plural.toLowerCase().includes(query))
                );
            }
            renderRoles();
        }

        // ============================================================
        // HEADER SHADOW
        // ============================================================
        const wrapper = document.getElementById('mainWrapper');
        const header = document.getElementById('mainHeader');
        wrapper.addEventListener('scroll', function() {
            header.classList.toggle('header-shadow', this.scrollTop > 30);
        });

        // ============================================================
        // INIT
        // ============================================================
        fetchRoles();

        console.log('🎯 Braintrust Roles loaded successfully!');
    </script>

</body>
</html>
